name: Build Release

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: windows-x64
            platform: win32
            arch: x64
            build-command: pnpm electron:build:win --x64 --publish never
          - os: macos-15-intel
            name: macos-x64
            platform: darwin
            arch: x64
            build-command: pnpm electron:build:mac --x64 --publish never
          - os: macos-15
            name: macos-arm64
            platform: darwin
            arch: arm64
            build-command: pnpm electron:build:mac --arm64 --publish never
          - os: ubuntu-latest
            name: linux-x64
            platform: linux
            arch: x64
            build-command: pnpm electron:build:linux --x64 --publish never

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        env:
          npm_config_platform: ${{ matrix.platform }}
          npm_config_arch: ${{ matrix.arch }}

      - name: Build app
        run: ${{ matrix.build-command }}
        env:
          npm_config_platform: ${{ matrix.platform }}
          npm_config_arch: ${{ matrix.arch }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: screen-go-${{ matrix.name }}
          path: |
            dist_electron/*.exe
            dist_electron/*.dmg
            dist_electron/*.AppImage
            dist_electron/*.deb
            dist_electron/*.zip
            dist_electron/*.blockmap
            dist_electron/latest*.yml
          if-no-files-found: ignore

      - name: Upload release assets
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist_electron/*.exe
            dist_electron/*.dmg
            dist_electron/*.AppImage
            dist_electron/*.deb
            dist_electron/*.zip
            dist_electron/*.blockmap
            dist_electron/latest*.yml
          fail_on_unmatched_files: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
